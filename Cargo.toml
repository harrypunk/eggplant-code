[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
eggplant-ui = { path = "crates/eggplant-ui" }
eggplant-core = { path = "crates/eggplant-core" }
eggplant-agent = { path = "crates/eggplant-agent" }

# External deps (forks live on LAN gitea; see PLAN.md)
ratatui = { git = "http://git.z.lan/fork/rataui" }
crossterm = "0.29"
helix-core = { git = "http://git.z.lan/fork/helix" }
helix-view = { git = "http://git.z.lan/fork/helix" }

# Third-party
arc-swap = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "fs"] }
